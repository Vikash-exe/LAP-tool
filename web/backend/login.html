<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Cadastral Parcel Finder</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #1f2d3a;
      background: linear-gradient(160deg, #e2f3f4 0%, #f7fbfb 55%, #d9eff0 100%);
    }
    .card {
      width: 100%; max-width: 360px; margin: 16px; padding: 28px 26px 20px; background: #fff;
      border: 1px solid #dbe3ec; border-radius: 12px; box-shadow: 0 8px 28px rgba(31, 45, 58, .10);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand img { width: 36px; height: 36px; }
    h1 { margin: 0; font-size: 20px; font-weight: 800; color: #2F4858; }
    .sub { margin: 4px 0 18px; font-size: 13px; color: #607080; }
    label { display: block; margin: 12px 0 4px; font-size: 12px; font-weight: 600; color: #546e7a; }
    input {
      width: 100%; padding: 9px 10px; font: inherit; font-size: 15px;
      border: 1px solid #b8c4d0; border-radius: 6px; background: #fff;
    }
    input:focus { outline: 2px solid #55DDE0; border-color: #33658A; }
    .pw { position: relative; }
    .pw input { padding-right: 60px; }
    .toggle {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      padding: 4px 6px; border: 0; background: none; color: #33658A; font-size: 12px; cursor: pointer;
    }
    .card { overflow: hidden; }
    .card::before {
      content: ""; display: block; height: 7px; margin: -28px -26px 22px;
      background: linear-gradient(90deg, #2F4858, #33658A 60%, #55DDE0);
    }
    .go {
      width: 100%; margin-top: 16px; padding: 11px; font: inherit; font-size: 15px; font-weight: 700;
      color: #fff; background: linear-gradient(180deg, #4a8bb3, #33658A); border: 1px solid #2F4858; border-radius: 10px;
      text-shadow: 0 1px 1px rgba(0, 0, 0, .25); box-shadow: 0 3px 0 #2F4858, 0 6px 14px rgba(47, 72, 88, .35);
      cursor: pointer; transition: transform .08s, box-shadow .08s;
    }
    .go:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 0 #2F4858, 0 10px 20px rgba(47, 72, 88, .42); }
    .go:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 0 0 #2F4858, 0 2px 4px rgba(47, 72, 88, .3); }
    .go:disabled { opacity: .6; cursor: default; }
    .err { min-height: 20px; margin-top: 12px; font-size: 13px; color: #b00020; }
    .foot { margin-top: 12px; font-size: 11px; color: #8a98a6; text-align: center; }
    .theme {
      position: fixed; top: 14px; right: 14px; padding: 6px 12px; font: inherit; font-size: 12px; font-weight: 600;
      color: #2F4858; background: rgba(255, 255, 255, .6); border: 1px solid #b9e0e2; border-radius: 999px; cursor: pointer;
      backdrop-filter: blur(20px);
    }
    /* dark theme: black in place of white, glass card */
    :root[data-theme="dark"] { color-scheme: dark; }
    [data-theme="dark"] body { color: #e6eef2; background: linear-gradient(160deg, #000 0%, #0a1a24 55%, #050708 100%); }
    [data-theme="dark"] .card { background: rgba(0, 0, 0, .55); border-color: rgba(255, 255, 255, .14); box-shadow: 0 8px 28px rgba(0, 0, 0, .6); backdrop-filter: blur(40px); }
    [data-theme="dark"] h1 { color: #e6eef2; }
    [data-theme="dark"] .sub, [data-theme="dark"] label { color: #a9bac4; }
    [data-theme="dark"] input { color: #e6eef2; background: rgba(0, 0, 0, .55); border-color: rgba(255, 255, 255, .25); }
    [data-theme="dark"] .toggle { color: #7fe3e6; }
    [data-theme="dark"] .err { color: #ff8a98; }
    [data-theme="dark"] .foot { color: #7f909b; }
    [data-theme="dark"] .theme { color: #e6eef2; background: rgba(255, 255, 255, .08); border-color: rgba(255, 255, 255, .25); }
  </style>
  <script>
    // Same saved choice as the main page, applied before the first paint.
    try { if (localStorage.getItem("theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch (e) {}
  </script>
</head>
<body>
  <button type="button" class="theme" id="theme" title="Switch between the light and dark theme"></button>
  <form class="card" id="form">
    <div class="brand"><img src="/favicon.svg" alt=""><h1>Cadastral Parcel Finder</h1></div>
    <div class="sub">Sign in to continue</div>

    <label for="user">User name</label>
    <input id="user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>

    <label for="pass">Password</label>
    <div class="pw">
      <input id="pass" name="password" type="password" autocomplete="current-password" required>
      <button type="button" class="toggle" id="toggle">Show</button>
    </div>

    <div class="err" id="err" role="alert"></div>
    <button class="go" id="go" type="submit">Sign in</button>
    <div class="foot">For authorised users only.</div>
  </form>

  <script>
    const form = document.getElementById("form");
    const user = document.getElementById("user");
    const pass = document.getElementById("pass");
    const err = document.getElementById("err");
    const go = document.getElementById("go");

    // After signing in, go back to where the person was heading, but only to a page on this site.
    function nextPage() {
      const n = new URLSearchParams(location.search).get("next") || "/";
      return n.startsWith("/") && !n.startsWith("//") && !n.startsWith("/\\") && !n.startsWith("/login") ? n : "/";
    }

    const themeBtn = document.getElementById("theme");
    function showTheme() {
      themeBtn.textContent = document.documentElement.dataset.theme === "dark" ? "☀ Light" : "☾ Dark";
    }
    themeBtn.addEventListener("click", () => {
      const dark = document.documentElement.dataset.theme !== "dark";
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch (e) {}
      showTheme();
    });
    showTheme();

    document.getElementById("toggle").addEventListener("click", (e) => {
      const show = pass.type === "password";
      pass.type = show ? "text" : "password";
      e.target.textContent = show ? "Hide" : "Show";
    });

    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      err.textContent = "";
      go.disabled = true;
      go.textContent = "Signing in...";
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: user.value.trim(), password: pass.value }),
        });
        if (res.ok) {
          location.replace(nextPage());
          return;
        }
        const body = await res.json().catch(() => ({}));
        err.textContent = body.detail || "Could not sign in.";
        pass.value = "";
        pass.focus();
      } catch (e) {
        err.textContent = "Cannot reach the server. Try again.";
      }
      go.disabled = false;
      go.textContent = "Sign in";
    });
  </script>
</body>
</html>
