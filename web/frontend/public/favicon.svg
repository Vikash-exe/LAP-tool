<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .base-grid { stroke: #2D3748; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .target-plot { fill: #FF6B00; fill-opacity: 0.2; stroke: #FF6B00; stroke-width: 2.5; stroke-linejoin: round; }
    .node { fill: #FF6B00; }
  </style>
  <!-- Surrounding cadastral registry lines -->
  <path class="base-grid" d="M3,16 H16 V29" />
  <path class="base-grid" d="M16,16 L29,22" />
  <path class="base-grid" d="M11,3 V16" />
  <path class="base-grid" d="M3,3 H29 V29 H3 Z" />
  <!-- Targeted land parcel -->
  <polygon class="target-plot" points="11,3 29,3 29,22 16,16 11,16" />
  <!-- Surveyor vertex point -->
  <circle class="node" cx="16" cy="16" r="3" />
</svg>
